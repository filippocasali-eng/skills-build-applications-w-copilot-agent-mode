name: MarketPilot AI Android

# Builds, tests and packages the native Android app in marketpilot/.
# - unit-tests: all JVM + Robolectric tests, debug APK
# - live-providers: real-network integration tests of the free data sources (no mocks)
# - emulator-e2e: instrumented end-to-end tests on an Android emulator
# - release: publishes the tested APK on the "marketpilot-android-latest" pre-release
on:
  push:
    paths: ["marketpilot/**", ".github/workflows/marketpilot-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpilot-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  JVM_TEST_TASKS: >-
    :core:model:test :core:common:test :core:network:test :domain:indicators:test :domain:market:test
    :domain:scoring:test :domain:risk:test :domain:portfolio:test :domain:papertrading:test
    :domain:backtesting:test :data:providers:test

jobs:
  unit-tests:
    name: Build + unit tests + debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM + Robolectric)
        run: ./gradlew $JVM_TEST_TASKS testDebugUnitTest --continue --stacktrace
      - name: Test summary
        if: always()
        run: python3 scripts/test_summary.py .
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Room schema (for migration tracking)
        if: always()
        run: ls -R core/database/schemas || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            marketpilot/**/build/reports/tests/**
            marketpilot/**/build/test-results/**
            marketpilot/core/database/schemas/**
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: marketpilot-debug-apk
          path: marketpilot/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  live-providers:
    name: Live provider integration tests (real network)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Live tests
        env:
          MP_LIVE_TESTS: "1"
        run: ./gradlew :data:providers:test --tests "*LiveProvidersTest" -i --stacktrace | grep -E "LIVE\[|PASSED|FAILED|SKIPPED|tests completed|BUILD" || true
      - name: Result summary
        if: always()
        run: python3 scripts/test_summary.py . && ! grep -l "<failure" data/providers/build/test-results/test/*Live*.xml
      - name: Provider sample probe (diagnostic)
        if: always()
        run: python3 scripts/probe_providers.py | head -60
