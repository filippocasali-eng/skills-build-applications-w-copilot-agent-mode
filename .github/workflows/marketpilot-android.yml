name: MarketPilot AI Android

# Builds, tests and packages the native Android app in marketpilot/.
# - unit-tests: all JVM + Robolectric tests, debug APK
# - live-providers: real-network integration tests of the free data sources (no mocks)
# - emulator-e2e: instrumented end-to-end tests on an Android emulator
# - release: publishes the tested APK on the "marketpilot-android-latest" pre-release
on:
  push:
    paths: ["marketpilot/**", ".github/workflows/marketpilot-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpilot-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  JVM_TEST_TASKS: >-
    :core:model:test :core:common:test :core:network:test :domain:indicators:test :domain:market:test
    :domain:scoring:test :domain:risk:test :domain:portfolio:test :domain:papertrading:test
    :domain:backtesting:test :data:providers:test

jobs:
  unit-tests:
    name: Build + unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: marketpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM + Robolectric)
        run: |
          set -o pipefail
          ./gradlew $JVM_TEST_TASKS testDebugUnitTest --continue 2>&1 | tee build.log
      - name: Compiler errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Execution failed|error:|Unresolved|> Task .* FAILED" build.log | head -80 || true
      - name: Test summary
        if: always()
        run: python3 scripts/test_summary.py .
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee assemble.log
      - name: Assemble errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Execution failed|error:|> Task .* FAILED" assemble.log | head -80 || true
      - name: Commit exported Room schema (migration tracking)
        if: always() && github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add core/database/schemas
            git commit -m "Update exported Room schema [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME} || echo "Schema push skipped (branch moved)"
          else
            echo "Room schema unchanged"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            marketpilot/**/build/reports/tests/**
            marketpilot/**/build/test-results/**
            marketpilot/core/database/schemas/**
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: marketpilot-debug-apk
          path: marketpilot/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  live-providers:
    name: Live provider integration tests (real network)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Live tests
        env:
          MP_LIVE_TESTS: "1"
        run: ./gradlew :data:providers:test --tests "*LiveProvidersTest" | tail -5 || true
      - name: Provider sample probe (diagnostic)
        if: always()
        run: python3 scripts/probe_providers.py 2>/dev/null | head -20 || true
      - name: Result summary
        if: always()
        run: python3 scripts/test_summary.py . && ! grep -l "<failure" data/providers/build/test-results/test/*Live*.xml

  emulator-e2e:
    name: End-to-end on Android emulator (real network)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: marketpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: marketpilot
          script: |
            adb logcat -c || true
            ./gradlew :app:connectedDebugAndroidTest || (adb logcat -d -s MarketPilotE2E:I AndroidRuntime:E TestRunner:* > e2e-logcat.txt; exit 1)
            adb logcat -d -s MarketPilotE2E:I > e2e-logcat.txt || true
      - name: E2E evidence
        if: always()
        run: |
          python3 scripts/test_summary.py . || true
          grep -h MarketPilotE2E e2e-logcat.txt 2>/dev/null | head -80 || true
          grep -h -E 'AndroidRuntime|Caused by' e2e-logcat.txt 2>/dev/null | head -30 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            marketpilot/app/build/outputs/androidTest-results/**
            marketpilot/app/build/reports/androidTests/**
            marketpilot/e2e-logcat.txt
          retention-days: 14

  release:
    name: Publish APK (pre-release)
    needs: [unit-tests, emulator-e2e]
    if: always() && needs.unit-tests.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: marketpilot-debug-apk
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          E2E: ${{ needs.emulator-e2e.result }}
        run: |
          APK="MarketPilotAI-1.0.0-build${GITHUB_RUN_NUMBER}.apk"
          mv dist/*.apk "dist/$APK"
          sha256sum "dist/$APK" | tee dist/SHA256.txt
          TAG=marketpilot-android-latest
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "dist/$APK" dist/SHA256.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "MarketPilot AI per Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK di test firmato con chiave di sideload del progetto (non Play Store). Build da ${GITHUB_SHA::7} su ${GITHUB_REF_NAME}. Esito test unitari: success. Esito test end-to-end su emulatore: ${E2E}. Installazione: vedi marketpilot/INSTALL_ANDROID.md. Solo paper trading: nessun ordine reale."
