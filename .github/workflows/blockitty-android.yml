name: Blockitty Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'blockitty/**'
      - '.github/workflows/blockitty-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockitty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run android:init
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: blockitty-apk
          path: blockitty/android/app/build/outputs/apk/debug/app-debug.apk
