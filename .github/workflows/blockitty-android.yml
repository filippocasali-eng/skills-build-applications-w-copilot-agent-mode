name: Blockitty Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'blockitty/**'
      - '.github/workflows/blockitty-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockitty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run android:init
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: blockitty-apk
          path: blockitty/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk blockitty.apk
      - name: Publish APK as a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blockitty-latest
          name: Blockitty (latest build)
          body: |
            Direct download: open this page on your Android phone, tap **blockitty.apk**, then allow installing from unknown sources.
            Built from ${{ github.sha }}.
          make_latest: true
          files: blockitty/blockitty.apk
      - name: Push APK to the blockitty-apk branch (backup download)
        working-directory: ${{ github.workspace }}
        run: |
          mkdir /tmp/apkbranch && cp blockitty/blockitty.apk /tmp/apkbranch/blockitty.apk
          cd /tmp/apkbranch
          git init -q -b blockitty-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockitty.apk
          git commit -q -m "Blockitty APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" blockitty-apk
