name: BattleQuiz CI

on:
  push:
    paths: ["battlequiz/**", ".github/workflows/battlequiz-ci.yml"]
  pull_request:
    paths: ["battlequiz/**", ".github/workflows/battlequiz-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battlequiz
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: battlequiz
          POSTGRES_PASSWORD: battlequiz
          POSTGRES_DB: battlequiz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U battlequiz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://battlequiz:battlequiz@localhost:5432/battlequiz_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: battlequiz/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: battlequiz/test-results
          retention-days: 7
