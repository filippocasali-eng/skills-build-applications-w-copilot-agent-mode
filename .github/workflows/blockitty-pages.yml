name: Blockitty Web (installable PWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blockitty/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - working-directory: blockitty
        run: node tools/build-web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blockitty/www
      - id: deployment
        uses: actions/deploy-pages@v4
