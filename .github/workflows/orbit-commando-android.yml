name: Orbit Commando '94 - Android build

on:
  push:
    branches:
      - "claude/orbit-commando-94-android-*"
    paths:
      - "orbit_commando/**"
      - ".github/workflows/orbit-commando-android.yml"
  workflow_dispatch:

concurrency:
  group: orbit-commando-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: orbit_commando
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=TEST_STORE=true

      # Sideloaded APK: Play Billing only works for apps installed from the
      # Play Store, so this build uses the labelled TEST STORE (fake
      # purchases) to keep every shop flow playable.
      - name: Build release APK (test store)
        run: flutter build apk --release --dart-define=TEST_STORE=true

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/orbit-commando-94-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/orbit-commando-94.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/orbit-commando-94.aab
          cp tool/smoke.sh dist/smoke.sh
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-commando-94-android
          path: orbit_commando/dist/*

      - name: Publish pre-release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-commando-latest
          name: "Orbit Commando '94 (latest build)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build from `${{ github.ref_name }}` at ${{ github.sha }}.

            - `orbit-commando-94.apk`: install on Android 7.0+ (allow "unknown sources"). The shop runs in TEST STORE mode: purchases are fake and free.
            - `orbit-commando-94-debug.apk`: debug build with logs (test store too).
            - `orbit-commando-94.aab`: bundle for Play Console with real Play Billing (signed with the debug key; re-sign before upload).
          files: |
            orbit_commando/dist/*.apk
            orbit_commando/dist/*.aab

  smoke:
    name: Launch the APK on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbit-commando-94-android
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and collect logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash dist/smoke.sh || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logcat
          path: smoke-*

      - name: Fail on crash
        run: |
          cat smoke-result.txt
          grep -q '^OK' smoke-result.txt
