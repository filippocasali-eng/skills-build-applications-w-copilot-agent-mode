<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Blockitty: Cat Block Puzzle</title>
  <meta name="description" content="Drag, drop and blast blocks with a squad of collectible cats. Free, relaxing, offline.">
  <meta name="theme-color" content="#ff7a8a">
  <meta property="og:title" content="Blockitty: Cat Block Puzzle">
  <meta property="og:description" content="Cute cats + satisfying block puzzle. Can you beat my score?">
  <meta property="og:image" content="icons/og.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="lvl" id="btn-profile" aria-label="Level">
        <span class="lvl-ring" id="lvl-ring"><span class="lvl-num" id="lvl">1</span></span>
      </button>
      <div class="cur"><span>🪙</span><b id="coins">0</b></div>
      <button class="cur" id="cur-gems" aria-label="Get gems"><span>💎</span><b id="gems">0</b><i>+</i></button>
    </header>

    <main>
      <section id="screen-home" class="screen active"></section>
      <section id="screen-cats" class="screen"></section>
      <section id="screen-shop" class="screen"></section>
      <section id="screen-pass" class="screen"></section>

      <section id="screen-game" class="screen">
        <div class="game-top">
          <button id="btn-pause" class="icon-btn" aria-label="Pause">⏸</button>
          <div class="score-box"><div id="score">0</div></div>
          <div class="best-box">👑 <span id="best">0</span></div>
        </div>
        <div class="buddy-row">
          <div id="buddy" class="buddy"></div>
          <div class="buddy-side">
            <div id="speech" class="speech"></div>
            <div id="combo" class="combo"></div>
            <div id="meter" class="meter" title="Rescue kittens to trigger Catnip Frenzy"></div>
          </div>
        </div>
        <div id="goal" class="goal" hidden><div class="fill"></div><div class="txt"></div></div>
        <div class="board-wrap">
          <canvas id="board"></canvas>
          <div id="tutorial" class="tutorial" hidden>
            <div class="hand">👆</div>
            <p>Drag a piece onto the board.<br>Fill a <b>row</b> or <b>column</b> to blast it!<br>🐱 Save trapped kittens for a <b>Frenzy ×3</b>!</p>
          </div>
        </div>
        <div id="tray" class="tray"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
        <div class="powers">
          <button data-power="hammer" aria-label="Hammer"><span>🔨</span><b class="count">0</b></button>
          <button data-power="bomb" aria-label="Bomb"><span>💣</span><b class="count">0</b></button>
          <button data-power="shuffle" aria-label="Shuffle"><span>🔄</span><b class="count">0</b></button>
        </div>
      </section>
    </main>

    <nav id="nav">
      <button data-nav="home" class="active"><span>🐾</span>Play</button>
      <button data-nav="cats"><span>🐱</span>Cats<i class="dot" id="dot-cats"></i></button>
      <button data-nav="shop"><span>🛍️</span>Shop<i class="dot" id="dot-shop"></i></button>
      <button data-nav="pass"><span>🎟️</span>Pass<i class="dot" id="dot-pass"></i></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
